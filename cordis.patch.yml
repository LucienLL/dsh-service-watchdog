# Bundle patch layer for dsh-service-watchdog: inserts the service-control row
# into the launcher composition (host half = lib/index.js, browser half =
# ./client). Values below are the composition `base` layer; overridable live
# from Settings -> Plugins -> Service control.
- insert:
    - id: service-control
      name: 'dsh-service-watchdog'
      config:
        watchdogPort: 43180
        autostart: true
        crashRestart: true
